syntax = "proto3";

package identity.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/S7venKing/ticket-box-go/gen/identity/v1;identityv1";

// IdentityService owns user accounts.
// It is an internal service: authentication/authorization of end users is
// enforced by api-gateway, callers here are trusted services.
service IdentityService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

  rpc GetUserById(GetUserByIdRequest) returns (GetUserByIdResponse);

  rpc GetUserByEmail(GetUserByEmailRequest) returns (GetUserByEmailResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  rpc AuthenticateUser(AuthenticateUserRequest) returns (AuthenticateUserResponse);

  rpc UpdateUserProfile(UpdateUserProfileRequest) returns (UpdateUserProfileResponse);

  rpc ActivateUser(ActivateUserRequest) returns (ActivateUserResponse);

  rpc DeactivateUser(DeactivateUserRequest) returns (DeactivateUserResponse);
  rpc AssignUserToOrganizer(AssignUserToOrganizerRequest) returns (AssignUserToOrganizerResponse);

  rpc CreateOrganizer(CreateOrganizerRequest) returns (CreateOrganizerResponse);
  rpc GetOrganizerById(GetOrganizerByIdRequest) returns (GetOrganizerByIdResponse);
  rpc ListOrganizers(ListOrganizersRequest) returns (ListOrganizersResponse);
  rpc UpdateOrganizer(UpdateOrganizerRequest) returns (UpdateOrganizerResponse);
}

// =========================
// User
// =========================

// User is the public representation of an account.
// Credentials (password, password hash) are never part of this message.
message User {
  string id = 1;
  string email = 2;
  string full_name = 3;
  string phone = 4;
  bool is_active = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  string role = 8;
  string organizer_id = 9;
}

// =========================
// Create User
// =========================

message CreateUserRequest {
  string email = 1;
  // Plaintext password. Only ever hashed by the application layer; never logged.
  string password = 2;
  string full_name = 3;
  string phone = 4;
  string role = 5;
}

message CreateUserResponse {
  User user = 1;
}

// =========================
// Get User By ID
// =========================

message GetUserByIdRequest {
  string id = 1;
}

message GetUserByIdResponse {
  User user = 1;
}

// =========================
// Get User By Email
// =========================

message GetUserByEmailRequest {
  string email = 1;
}

message GetUserByEmailResponse {
  User user = 1;
}

message ListUsersRequest {
  int32 offset = 1;
  int32 limit = 2;
}

message ListUsersResponse {
  repeated User users = 1;
}

// =========================
// Authenticate User
// =========================

message AuthenticateUserRequest {
  string email = 1;
  string password = 2;
}

message AuthenticateUserResponse {
  User user = 1;
  string access_token = 2;
}

// =========================
// Update User Profile
// =========================

message UpdateUserProfileRequest {
  string id = 1;
  string full_name = 2;
  string phone = 3;
}

message UpdateUserProfileResponse {
  User user = 1;
}

// =========================
// Activate User
// =========================

message ActivateUserRequest {
  string id = 1;
}

message ActivateUserResponse {
  User user = 1;
}

// =========================
// Deactivate User
// =========================

message DeactivateUserRequest {
  string id = 1;
}

message DeactivateUserResponse {
  User user = 1;
}

message AssignUserToOrganizerRequest {
  string user_id = 1;
  string organizer_id = 2;
}

message AssignUserToOrganizerResponse {
  User user = 1;
}

// =========================
// Organizer
// =========================

message Organizer {
  string id = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
  string slug = 5;
  bool is_active = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message CreateOrganizerRequest {
  string name = 1;
  string email = 2;
  string phone = 3;
  string slug = 4;
}

message CreateOrganizerResponse { Organizer organizer = 1; }
message GetOrganizerByIdRequest { string id = 1; }
message GetOrganizerByIdResponse { Organizer organizer = 1; }
message ListOrganizersRequest { int32 offset = 1; int32 limit = 2; }
message ListOrganizersResponse { repeated Organizer organizers = 1; }

message UpdateOrganizerRequest {
  string id = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
  string slug = 5;
}

message UpdateOrganizerResponse { Organizer organizer = 1; }
