services:

  mysql:
    image: mysql:8.4
    container_name: ticketbox-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: identity_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Local dev only: MySQL runs *.sql from this folder on first init.
      - ./services/identity-service/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  identity-service:
    build:
      context: .                                   # repo root: needs gen/ and the service
      dockerfile: services/identity-service/Dockerfile
    container_name: ticketbox-identity-service
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_PORT: "50051"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: identity_db
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      JWT_SECRET: s7venKing@123
    ports:
      - "50051:50051"
    depends_on:
      mysql:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: ticketbox-api-gateway
    restart: unless-stopped
    environment:
      PORT: "8080"
      JWT_SECRET: s7venKing@123
      IDENTITY_SERVICE_ADDR: identity-service:50051
      TICKET_SERVICE_ADDR: ticket-service:50052
    ports:
      - "8081:8080"
    depends_on:
      identity-service:
        condition: service_started
      ticket-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticketbox-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      ticket-service:
        condition: service_started

  ticket-service:
    build:
      context: .
      dockerfile: services/ticket-service/Dockerfile
    container_name: ticketbox-ticket-service
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_PORT: "50052"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ticket_db
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "50052:50052"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
