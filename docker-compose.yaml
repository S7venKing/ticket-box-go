services:

  mysql:
    image: mysql:8.4
    container_name: ticketbox-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: identity_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Local dev only: MySQL runs *.sql from this folder on first init.
      - ./services/identity-service/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  identity-service:
    build:
      context: .                                   # repo root: needs gen/ and the service
      dockerfile: services/identity-service/Dockerfile
    container_name: ticketbox-identity-service
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_PORT: "50051"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: identity_db
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "50051:50051"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
